name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Menerapkan file patch update terbaru di root repo (update-1.3.patch, dst.)
      - name: Terapkan patch update
        run: |
          p=$(find . -maxdepth 1 -iname 'update-*.patch' | sort -V | tail -1)
          if [ -z "$p" ]; then
            echo "Tidak ada file patch, lanjut build"
          elif git apply --check "$p" 2>/dev/null; then
            git apply "$p"
            echo "Patch diterapkan: $p"
          elif git apply --reverse --check "$p" 2>/dev/null; then
            echo "Patch sudah ada di kode: $p"
          else
            echo "::error::Patch tidak cocok dengan kode saat ini: $p"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Siapkan keystore dari secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/guild.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/guild.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 kosong, APK tidak ditandatangani dengan keystore"
          fi

      - name: Build APK release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          APPROVER_EMAIL: ${{ secrets.APPROVER_EMAIL }}
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: GuildGames-APK
          path: app/build/outputs/apk/**/*.apk
